<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="pencil.png">
    <title>To-Do List</title>
</head>
<body>
    <div class="container">
        <div class="title">📝 To-Do List <button id="mute"></button></div>
        <div id="input">
            <div class="taskarea">
                <input type="text" id="task" placeholder="➕ Add Task">
                <div class="menu">
                    <select id="priority" style="font-size: 20px;" required>
                        <option value="placeholder" disabled selected>Priority</option>
                        <option value="0" style="background-color: #4caf50;">Low</option>
                        <option value="1" style="background-color: #f4d03f;">Medium</option>
                        <option value="2" style="background-color: #e74c3c;">High</option>
                    </select>
                </div>
            </div>
            <div class="btn"><button id="add">ADD</button><button id="sort">SORT</button></div>
        </div>
        <div class="progress"><progress id="progress" max="0" value="0"></progress><button id="deleteAll"></button><button id="deletechecked"></button></div>
        <div id="list">
            <p class="empty">No tasks yet. Add one 👇✨</p>
        </div>
    </div>
    <script>
        // getting elements
        const soundEffect = new Audio("delete.mp3")
        const soundEffect2 = new Audio("add.mp3")
        const taskList = document.querySelector("#list")
        const task = document.querySelector("#task")
        const priority = document.getElementById("priority")
        const addBtn = document.querySelector("#add")
        const sortBtn = document.querySelector("#sort")
        const progressBar = document.querySelector("#progress")
        const clear = document.querySelector("#deleteAll")
        const clearCompleted = document.querySelector("#deletechecked")
        const emptylist = document.querySelector("p.empty")
        const muteBtn = document.querySelector("#mute")
        const colors = ["#4caf50","#f4d03f","#e74c3c"]
        const btnSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20px" height="20px"><path d="M 10 2 L 9 3 L 3 3 L 3 5 L 21 5 L 21 3 L 15 3 L 14 2 L 10 2 z M 4.3652344 7 L 5.8925781 20.263672 C 6.0245781 21.253672 6.877 22 7.875 22 L 16.123047 22 C 17.121047 22 17.974422 21.254859 18.107422 20.255859 L 19.634766 7 L 4.3652344 7 z"/></svg>`;
        const btnSvg2 = '<svg height="60px" width="60px" version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" xml:space="preserve"><g><g><g><path d="M437.016,74.984c-99.979-99.979-262.075-99.979-362.033,0.002c-99.978,99.978-99.978,262.073,0.004,362.031 c99.954,99.978,262.05,99.978,362.029-0.002C536.995,337.059,536.995,174.964,437.016,74.984z M406.848,406.844 c-83.318,83.318-218.396,83.318-301.691,0.004c-83.318-83.299-83.318-218.377-0.002-301.693 c83.297-83.317,218.375-83.317,301.691,0S490.162,323.549,406.848,406.844z"/><path d="M361.592,150.408c-8.331-8.331-21.839-8.331-30.17,0l-75.425,75.425l-75.425-75.425c-8.331-8.331-21.839-8.331-30.17,0 s-8.331,21.839,0,30.17l75.425,75.425L150.43,331.4c-8.331,8.331-8.331,21.839,0,30.17c8.331,8.331,21.839,8.331,30.17,0 l75.397-75.397l75.419,75.419c8.331,8.331,21.839,8.331,30.17,0c8.331-8.331,8.331-21.839,0-30.17l-75.419-75.419l75.425-75.425 C369.923,172.247,369.923,158.74,361.592,150.408z"/></g></g></g></svg>'
        const btnSvg3 = '<svg height="30px" width="30px" version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 319.748 319.748" xml:space="preserve"><g id="XMLID_783_"><path id="XMLID_784_" d="M192.078,26.649c-4.878-2.61-10.795-2.324-15.398,0.744L90.458,84.874H15c-8.284,0-15,6.716-15,15v120 c0,8.284,6.716,15,15,15h75.458l86.221,57.481c2.51,1.673,5.411,2.519,8.321,2.519c2.426,0,4.859-0.588,7.077-1.775 c4.878-2.61,7.922-7.693,7.922-13.225v-240C200,34.342,196.955,29.259,192.078,26.649z M170,251.846l-66.68-44.453 c-2.464-1.643-5.359-2.519-8.32-2.519H30v-90h65c2.961,0,5.856-0.877,8.32-2.519L170,67.902V251.846z"/><path id="XMLID_787_" d="M301.212,159.873l14.142-14.142c5.858-5.858,5.858-15.355,0-21.213c-5.857-5.858-15.355-5.858-21.213,0 l-14.142,14.142l-14.142-14.142c-5.857-5.858-15.356-5.858-21.213,0c-5.858,5.858-5.858,15.355,0,21.213l14.142,14.142 l-14.142,14.142c-5.858,5.858-5.858,15.355,0,21.213c2.929,2.929,6.768,4.393,10.607,4.393c3.839,0,7.678-1.464,10.606-4.393 l14.142-14.142l14.142,14.142c2.929,2.929,6.768,4.393,10.606,4.393c3.839,0,7.678-1.464,10.606-4.393 c5.858-5.858,5.858-15.355,0-21.213L301.212,159.873z"/></g></svg>'
        clearCompleted.innerHTML = btnSvg2
        clear.innerHTML = btnSvg
        muteBtn.innerHTML = btnSvg3
        // local storage call
        let vault = JSON.parse(localStorage.getItem("tasks") || "[]")
        let isMuted = JSON.parse(localStorage.getItem("IsMuted") || "false");
        // maintain order after refresh
        soundEffect.muted = isMuted
        soundEffect2.muted = isMuted
        let id = vault.length ? Math.max(...vault.map(t => t.ID)) + 1 : 0;
        vault.forEach(item => {createTask(taskList,item.taskName,item.taskPriority,item.ID,item.taskDone)})
        progressBar.max = document.querySelectorAll(".todo").length
        progressBar.value = document.querySelectorAll(".todo input:checked").length
        checkEmpty()
        // main function (adding tasks)
        function createTask (parent,inputbar,priority,ID,done=false){
            // creating the elements and setting its classes and values
            let cont = document.createElement("div")
            cont.classList.add("todo")
            cont.setAttribute("prio",priority)
            cont.setAttribute("ID",ID)
            cont.setAttribute("completed",false)
            cont.style.backgroundColor = colors[priority];
            let givenTask = document.createElement("p")
            let deleteTask = document.createElement("button")
            deleteTask.classList.add("delete")
            deleteTask.innerHTML = btnSvg
            let checkTask = document.createElement("input")
            checkTask.type = "checkbox"
            done = done === true || done === "true";
            checkTask.checked = done
            if (typeof(inputbar) === "string") {
                givenTask.textContent = inputbar
            } else {givenTask.textContent = inputbar.value; inputbar.value = ""}
            if (done) {givenTask.style.textDecoration = "line-through";cont.setAttribute("completed",true)}
            // delete animation listner and remove task
            cont.addEventListener("transitionend", () => {
                cont.remove()
                progressBar.max = document.querySelectorAll(".todo").length
                progressBar.value = document.querySelectorAll(".todo input:checked").length
                removeFromVault(givenTask.textContent,cont.getAttribute("ID"))
                checkEmpty()
            },{once:true});
            // add the deleted class to start the animation
            deleteTask.addEventListener("click", ()=> {
                cont.classList.add("deleted")
                soundEffect.pause()
                soundEffect.currentTime = 0
                soundEffect.play()
            })
            // apply strike through when box is checked and remove when not checked
            checkTask.addEventListener("change",()=>{
                if (checkTask.checked) {givenTask.style.textDecoration = "line-through";cont.setAttribute("completed",true)}
                else {givenTask.style.textDecoration = "none";cont.setAttribute("completed",false)}
                progressBar.value = document.querySelectorAll(".todo input:checked").length
                updateVault(givenTask.textContent,checkTask.checked,cont.getAttribute("ID"))
            })
            // adding everything togther
            cont.append(checkTask,givenTask,deleteTask)
            parent.appendChild(cont)
        }
        // sort function for the button
        function sortTasks (taskList) {
            let tasks = Array.from(document.querySelectorAll(".todo"))
            tasks.sort((a,b)=> Number(b.getAttribute("prio")) - Number(a.getAttribute("prio")))
            tasks.forEach(item => {taskList.appendChild(item)});
            vault.sort((a, b) => b.taskPriority - a.taskPriority);
            localStorage.setItem("tasks", JSON.stringify(vault));
        }
        // mute sound
        function muteAudtio() {
            isMuted = !isMuted
            soundEffect.pause()
            soundEffect2.pause()
            soundEffect.muted = isMuted
            soundEffect2.muted = isMuted
            localStorage.setItem("IsMuted", JSON.stringify(isMuted));
        }
        // check if task list is empty and display a message based on that
        function checkEmpty(){if(taskList.children.length == 1){emptylist.style.display = "block"}else emptylist.style.display = "none"}
        //  listner for adding tasks
        addBtn.addEventListener("click", () => {
            if (task.value.trim() !== "") {
                if (priority.value === "placeholder") priority.value = 0;
                let taskname = task.value
                let taskprio = parseInt(priority.value)
                createTask(taskList, task, parseInt(priority.value),id);
                progressBar.max = document.querySelectorAll(".todo").length
                priority.value = "placeholder"
                priority.style.backgroundColor = "#F8F7FF"
                task.focus();
                addToVault(taskname,taskprio,false,id)
                checkEmpty()
                id+=1
                soundEffect2.pause()
                soundEffect2.currentTime = 0
                soundEffect2.play()
        }})
        // listner for sorting tasks
        sortBtn.addEventListener("click",() => {
            if (taskList) {sortTasks(taskList)}
        })
        // listner to change task background based on priority
        priority.addEventListener("change", () => {
            priority.style.backgroundColor = ["#4caf50","#f4d03f","#e74c3c"][priority.value]
        })
        // listner to allow user to write in the input with clicking buttons and submit with enter
        document.addEventListener("keypress", (e) => {
            if (e.key==="Enter") addBtn.dispatchEvent(new Event("click"));
            else if (e.key.length === 1) task.focus();
        })
        // listner for delete all button
        clear.addEventListener("click",() => {
            let tasks = Array.from(document.querySelectorAll(".todo"))
            if (document.querySelectorAll(".todo").length > 0) {
                soundEffect.pause()
                soundEffect.currentTime = 0
                soundEffect.play()
            }
            tasks.forEach(item => item.classList.add("deleted"))
            localStorage.setItem("tasks",JSON.stringify([]))
            checkEmpty()
            
        })
        // listner to removed completed tasks
        clearCompleted.addEventListener("click",() => {
            let tasks = Array.from(document.querySelectorAll(".todo"))
            if (document.querySelectorAll("input:checked").length > 0) {
                soundEffect.pause()
                soundEffect.currentTime = 0
                soundEffect.play()
            }
            tasks.forEach(item => {if(item.getAttribute("completed") === "true"){item.classList.add("deleted")}})
            checkEmpty()
            
        })
        muteBtn.addEventListener("click",() => {muteAudtio()})
        // functions for managing local storage
        // add the task to local storage
        function addToVault(taskContent,priority,done,id) {
            vault.push({ID:id,taskName:taskContent, taskPriority:priority, taskDone:done})
            localStorage.setItem("tasks",JSON.stringify(vault))
        }
        // update task in local storage (mark done for strike through)
        function updateVault(taskContent,done,id) {
            vault.forEach(item => {if(item.taskName === taskContent && item.ID == id) item.taskDone = done})
            localStorage.setItem("tasks",JSON.stringify(vault))
        }
        // remove task from local storage
        function removeFromVault(taskContent,id) {
            vault = vault.filter(item => !(item.taskName === taskContent && item.ID == id))
            localStorage.setItem("tasks",JSON.stringify(vault))
        }
    </script>
</body>
</html>
